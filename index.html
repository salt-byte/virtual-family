html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #FFF4DF; color: #4A3424; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; background: #FFF4DF; display: flex; flex-direction: column;
	justify-content: center; align-items: center; gap: 22px; font-family: "QijiaTitle", "Songti SC", serif; }
#status-title { font-size: 72px; letter-spacing: 0.2em; margin-left: 0.2em; color: #8A5A36; }
#status-bar { width: min(320px, 70vw); height: 14px; border: 3px solid #8A5A36; border-radius: 10px;
	background: #F3E6CC; overflow: hidden; }
#status-fill { height: 100%; width: 0; background: #E5533C; border-radius: 6px; transition: width 0.2s; }
#status-text { font-size: 20px; color: #9A8672; min-height: 1.4em; }
#status-notice { display: none; max-width: 32em; margin: 0 2rem; padding: 1rem; text-align: center;
	background: #FFE3B0; border: 2px solid #8A5A36; border-radius: 12px; line-height: 1.5;
	font-family: sans-serif; font-size: 15px; }

<body>
<canvas id="canvas">打开页面需要浏览器支持 canvas。</canvas>
<noscript>打开页面需要浏览器支持 JavaScript。</noscript>
<div id="status">
	<div id="status-title">起家</div>
	<div id="status-bar"><div id="status-fill"></div></div>
	<div id="status-text">正在收拾屋子…</div>
	<div id="status-notice"></div>
</div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11520736,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const status = document.getElementById('status');
	const fill = document.getElementById('status-fill');
	const text = document.getElementById('status-text');
	const notice = document.getElementById('status-notice');
	const MB = 1024 * 1024;
	function fail(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		text.textContent = '加载失败，请刷新试试';
		notice.textContent = msg;
		notice.style.display = 'block';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('The following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.style.width = (100 * current / total).toFixed(1) + '%';
				text.textContent = current >= total ? '正在收拾屋子…'
					: '正在收拾屋子…  ' + (current / MB).toFixed(1) + ' / ' + (total / MB).toFixed(1) + ' MB';
			}
		},
	}).then(function () { status.remove(); }, fail);
}());
</script>
</body>
